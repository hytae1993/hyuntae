<section class="protected-notes" data-protected-notes data-payload-url="{{ '/assets/research-notes.enc.json' | relative_url }}">
  <header class="protected-notes-header">
    <p class="section-kicker">Private archive</p>
    <h1>Research Notes</h1>
    <p>개인 연구노트입니다. 계속하려면 비밀번호를 입력하세요.</p>
  </header>

  <form class="unlock-form" data-unlock-form>
    <label for="research-notes-password">Password</label>
    <div class="unlock-field">
      <input
        id="research-notes-password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        aria-describedby="unlock-message"
      >
      <button type="submit">Unlock</button>
    </div>
    <p id="unlock-message" class="unlock-message" data-unlock-message role="status" aria-live="polite"></p>
  </form>

  <div class="private-notes-content" data-private-notes-content hidden></div>

  <noscript>
    <p class="unlock-message is-error">연구노트를 열려면 JavaScript를 활성화해야 합니다.</p>
  </noscript>
</section>

<script src="{{ '/assets/research-notes-unlock.js' | relative_url }}" defer></script>
