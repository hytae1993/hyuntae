---
layout: default
---

<article class="research-article">
  <header class="research-article-header">
    <div class="research-article-eyebrow">
      <span>{{ page.section | default: 'Research' | replace: 'papers', 'Paper Review' }}</span>
      {% if page.publication %}<span>{{ page.publication }}</span>{% endif %}
    </div>

    <h1 class="research-article-title">{{ page.title }}</h1>

    <div class="research-article-meta">
      {% if page.task %}<span>{{ page.task }}</span>{% endif %}
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y.%m.%d' }}</time>
    </div>
  </header>

  <div class="research-article-body">
    {{ content }}
  </div>
</article>
